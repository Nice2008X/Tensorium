name: 🐛 Bug Report
description: File a structured report to help us solve a bug.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Tensorium runs entirely
        client-side, so most bugs are specific to a browser/model
        combination — the more detail below, the faster this gets fixed.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have checked the README's [Known limitations](https://github.com/Nice2008X/Tensorium#known-limitations) section — this isn't already a documented limitation.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug, including which model/preset you loaded.
      placeholder: |
        1. Load preset '...' (or repo id '...')
        2. Click on '...'
        3. Run a forward pass with prompt '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: model-repo
    attributes:
      label: Model / repo id
      description: Which Hugging Face repo (or local files) were loaded when this happened, if applicable.
      placeholder: e.g. deepseek-ai/DeepSeek-V2-Lite, or "local files"
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other (specify in Additional context)
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: e.g. 128.0.6613.120
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: console-errors
    attributes:
      label: Console errors
      description: Any errors from the browser's DevTools console (press F12). This is often the single most useful thing you can include.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help explain the problem.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else worth knowing — a link to a specific model repo, network conditions, browser extensions, etc.
    validations:
      required: false
